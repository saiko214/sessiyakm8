<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C# ООП тест — дайындық</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5ff;--card:#fff;--tx:#1d1b3a;--mu:#6b6a85;--pr:#5b4bdb;--pr2:#ece9ff;--ok:#1a9d5c;--okb:#e1f6ea;--er:#d6353f;--erb:#fde8ea;--bd:#e2e0f3;--code:#17163a;--codet:#e9e7ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121122;--card:#1c1b33;--tx:#efeefc;--mu:#a09fc0;--pr:#8f82ff;--pr2:#2a2750;--ok:#4cd68c;--okb:#173a2a;--er:#ff7078;--erb:#3d1c24;--bd:#34325a;--code:#0c0b1b}}
:root[data-theme="dark"]{--bg:#121122;--card:#1c1b33;--tx:#efeefc;--mu:#a09fc0;--pr:#8f82ff;--pr2:#2a2750;--ok:#4cd68c;--okb:#173a2a;--er:#ff7078;--erb:#3d1c24;--bd:#34325a;--code:#0c0b1b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:680px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:26px;margin:8px 0 4px}h2{font-size:20px;margin:0 0 8px}
.sub{color:var(--mu);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
.mode{display:block;width:100%;text-align:left;cursor:pointer;color:inherit;font:inherit;transition:transform .1s}
.mode:active{transform:scale(.98)}.mode b{display:block;font-size:18px}.mode span{color:var(--mu);font-size:14px}
.ic{font-size:26px;float:right;margin-left:8px}
.btn{background:var(--pr);color:#fff;border:0;border-radius:12px;padding:13px 18px;font:600 16px inherit;font-family:inherit;cursor:pointer}
.btn.g{background:var(--pr2);color:var(--pr)}.btn:disabled{opacity:.4}
.row{display:flex;gap:10px}.row .btn{flex:1}
.bar{height:8px;background:var(--pr2);border-radius:8px;overflow:hidden;margin:8px 0 14px}.bar i{display:block;height:100%;background:var(--pr);transition:width .2s}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:14px}
.top button{background:none;border:0;color:var(--mu);font:inherit;cursor:pointer;padding:6px 0}
.q{font-size:18px;font-weight:600;margin:6px 0 12px}
pre{background:var(--code);color:var(--codet);padding:12px;border-radius:12px;overflow-x:auto;font:13.5px/1.5 ui-monospace,Menlo,Consolas,monospace;margin:0 0 14px}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:var(--card);color:var(--tx);border:2px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px;font:inherit;cursor:pointer}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;background:var(--pr2);color:var(--pr);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt.s{border-color:var(--pr);background:var(--pr2)}.opt.s .l{background:var(--pr);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okb);cursor:default}.opt.ok .l{background:var(--ok);color:#fff}
.opt.er{border-color:var(--er);background:var(--erb);cursor:default}.opt.er .l{background:var(--er);color:#fff}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.nav button{width:36px;height:36px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--mu);font:600 13px inherit;font-family:inherit;cursor:pointer}
.nav .d{background:var(--pr2);color:var(--pr);border-color:var(--pr2)}.nav .c{border-color:var(--pr);color:var(--pr)}
.ring{width:150px;height:150px;border-radius:50%;margin:10px auto;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--pr2) 0)}
.ring div{width:118px;height:118px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:34px;font-weight:800}
.c{text-align:center}.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:8px;margin-bottom:6px}
.tag.e{background:var(--erb);color:var(--er)}
.ans{font-size:14px;margin:4px 0}.ans.o{color:var(--ok)}.ans.x{color:var(--er)}
</style>
</head>
<body>
<div class="w" id="app"></div>
<script>
const Q=[{"q": "Объектіге бағытталған бағдарламалау парадигмасының негізгі тұжырымдамасы қандай?", "c": "", "o": ["Командалардың қатаң сызықтық тізбегі", "Тек функциялардан тұратын тізбек", "Деректі әдіспен біріктіретін объектілер", "Тек жаһандық айнымалылар жиынтығы"], "a": 2, "e": "Бағдарлама деректер мен әдістерді бір объектіге біріктіреді: инкапсуляция, мұрагерлік, полиморфизм, абстракция."}, {"q": "Әдісті шақырған кезде C# тіліндегі берілген код нені шығарады?", "c": "class Person\n{\npublic string Name = \"Alex\";\n}\nPerson p = new Person();\nConsole.Write(p.Name);", "o": ["Name", "Person", "Компиляция қатесі", "Alex"], "a": 3, "e": "Name өрісінің мәні «Alex», p.Name сол мәнді шығарады."}, {"q": "Қандай қол жеткізу модификаторы класс элементін ТЕК осы класстың ішінде қолжетімді етеді?", "c": "", "o": ["public", "private", "internal", "protected"], "a": 1, "e": "private — тек осы класстың ішінде көрінеді."}, {"q": "C# тіліндегі класс конструкторы қандай рөл атқарады?", "c": "", "o": ["Бағдарламаны іске қосып, тоқтатып қояды", "Класс әдістерін бір-бірімен салыстырады", "Объект өрістерін бастапқы мәнмен толтырады", "Объектіні жадтан толық жойып тастайды"], "a": 2, "e": "Конструктор new шақырылғанда автоматты орындалып, объектіні дайындайды."}, {"q": "C# тіліндегі келесі код үзіндісі нені шығарады?", "c": "class Car\n{\npublic int Speed;\npublic Car(int speed)\n{\nSpeed = speed;\n}\n}\nCar c = new Car(100);\nConsole.Write(c.Speed);", "o": ["Speed", "100", "0", "Компиляция қатесі"], "a": 1, "e": "Конструктор Speed-ке 100 жазады, c.Speed = 100."}, {"q": "Объектіге бағытталған бағдарламалауда (ООП) инкапсуляция деп нені түсінеді?", "c": "", "o": ["Әдістің түрлі түрде жұмыс істеуі", "Класстың данасын жасау", "Деректі жасырып, әдіс арқылы ашу", "Бір класты екіншісінен тудыру"], "a": 2, "e": "Инкапсуляция: ішкі деректер жасырылады, тек public әдіс/қасиет арқылы қолжетімді."}, {"q": "C# тіліндегі қандай қол жеткізу модификаторы класс мүшесіне ағымдағы жинақ (.dll/.exe) шегінде қолжетімділікке рұқсат береді?", "c": "", "o": ["private", "public", "protected", "internal"], "a": 3, "e": "internal — тек сол жинақ (.dll/.exe) ішінде көрінеді."}, {"q": "Жеке (private) айнымалыға қол жеткізуге тырысқанда бұл код нені шығарады?", "c": "class Account\n{\nprivate int balance = 500;\n}\nAccount acc = new Account();\nConsole.Write(acc.balance);", "o": ["Ештеңе шықпайды", "Компиляция қатесі", "0 мәнін шығарады", "500 мәнін шығарады"], "a": 1, "e": "balance — private, сырттан қол жеткізуге болмайды."}, {"q": "C# тілінде автоқасиеттер (Auto-Properties) не үшін қолданылады?", "c": "", "o": ["Статикалық әдіс жариялау үшін", "Класты мұрагерліктен қорғау үшін", "Get/set қасиетін қысқа жазу үшін", "Қатені өңдеу үшін"], "a": 2, "e": "Автоқасиетте жасырын өрісті компилятор өзі жасайды."}, {"q": "Логикасы бар қасиетті қолданатын C# код үзіндісі нені шығарады?", "c": "class User\n{\nprivate int _age;\npublic int Age\n{\nget => _age;\nset => _age = value < 0 ? 0 : value;\n}\n}\nUser u = new User();\nu.Age = -15;\nConsole.Write(u.Age);", "o": ["-15", "Компиляция қатесі", "15", "0"], "a": 3, "e": "value < 0 болса, set ішінде 0 жазылады."}, {"q": "C# тілінде бір класты екіншісінен мұрагерлікке алу үшін қандай кілт сөз қолданылады?", "c": "", "o": ["implements кілт сөзі", "қос нүкте (:)", "extends кілт сөзі", "inherits кілт сөзі"], "a": 1, "e": "C#-та мұрагерлік class Dog : Animal түрінде жазылады."}, {"q": "Мұраланған әдісті шақырған кезде бұл код нені шығарады?", "c": "class Animal\n{\npublic void Eat() => Console.Write(\"Food\");\n}\nclass Dog : Animal { }Dog d = new Dog();\nd.Eat();", "o": ["Компиляция қатесі", "Dog", "Eat", "Food"], "a": 3, "e": "Dog Eat() әдісін Animal-дан мұрагерлікпен алады."}, {"q": "C# тілінде негізгі класста еншілес класқа әдісті қайта анықтауға рұқсат беру үшін қандай кілт сөз қолданылады?", "c": "", "o": ["sealed", "abstract", "virtual", "override"], "a": 2, "e": "Базалық класта әдіс virtual деп жазылады."}, {"q": "C# тілінде негізгі класстың виртуалды әдісін қайта анықтау үшін еншілес класста қандай кілт сөз қолданылады?", "c": "", "o": ["virtual", "base", "override", "new"], "a": 2, "e": "Туынды класта әдіс override деп қайта анықталады."}, {"q": "Полиморфизмі бар келесі код үзіндісі нені шығарады?", "c": "class Printer\n{\npublic virtual void Print() => Console.Write(\"Base\");\n}\nclass ColorPrinter : Printer\n{\npublic override void Print() => Console.Write(\"Color\");\n}\nPrinter p = new ColorPrinter();\np.Print();", "o": ["Base", "Компиляция қатесі", "BaseColor", "Color"], "a": 3, "e": "Виртуал әдіс нақты объектінің (ColorPrinter) түріне қарай орындалады."}, {"q": "Негізгі класқа base кілт сөзі арқылы қол жеткізген кезде бұл код нені шығарады?", "c": "class Parent\n{\npublic virtual void Greet() => Console.Write(\"Hi\");\n}\nclass Child : Parent\n{\npublic override void Greet()\n{\nbase.Greet();\nConsole.Write(\"!\");\n}\n}\nChild c = new Child();\nc.Greet();", "o": ["Hi!", "Hi", "!", "!Hi"], "a": 0, "e": "Алдымен base.Greet() «Hi» жазады, содан кейін «!» жазылады."}, {"q": "C# тілінде қандай кілт сөз осы класстан әрі қарай мұрагерлікке алуға тыйым салады?", "c": "", "o": ["sealed", "readonly", "static", "abstract"], "a": 0, "e": "sealed класстан мұрагерлікке алуға болмайды."}, {"q": "sealed модификаторы бар класстан мұрагерлікке алуға тырысқанда қандай қате орын алады?", "c": "sealed class FinalClass { }class SubClass : FinalClass { }", "o": ["Қате болмайды", "Компиляция қатесі", "Орындалу қатесі", "Тек ескерту шығады"], "a": 1, "e": "sealed класстан тудыруға болмайды (CS0509)."}, {"q": "C# тіліндегі абстрактілі класс дегеніміз не?", "c": "", "o": ["Тек құрылымдардан тұратын арнайы класс", "Объектісі жасалмайтын негізгі класс", "Мұрагерлікке мүлде жабық болатын класс", "Барлық мүшесі статикалық болатын класс"], "a": 1, "e": "Абстрактілі класстан new жасалмайды, ол шаблон ретінде қызмет етеді."}, {"q": "Абстрактілі класы бар келесі код үзіндісі нені шығарады?", "c": "abstract class Appliance\n{\npublic abstract void TurnOn();\n}\nclass Lamp : Appliance\n{\npublic override void TurnOn() => Console.Write(\"Light\");\n}\nAppliance a = new Lamp();\na.TurnOn();", "o": ["Компиляция қатесі", "TurnOn", "Lamp", "Light"], "a": 3, "e": "Lamp абстрактілі әдісті override етіп, «Light» шығарады."}, {"q": "C# тіліндегі интерфейс (interface) дегеніміз не?", "c": "", "o": ["Іске асырусыз мүшелер келісімшарты", "Объект жасауға арналған арнайы класс", "Тек статикалық әдісі бар арнайы класс", "Деректерді сақтауға арналған массив"], "a": 0, "e": "Интерфейс — класс орындауға міндетті мүшелер тізімі."}, {"q": "C# тілінде класс интерфейсті іске асыру үшін қандай кілт сөз қолданылады?", "c": "", "o": ["implements кілт сөзі", "қос нүкте (:)", "using кілт сөзі", "interface кілт сөзі"], "a": 1, "e": "class Athlete : IRunner — мұрагерлік те, интерфейс те «:» арқылы жазылады."}, {"q": "C# тілінде бір класс бір мезгілде қанша интерфейсті іске асыра алады?", "c": "", "o": ["Ешқайсысын", "Тек біреуін", "Ең көбі екеуін", "Қалаған санын"], "a": 3, "e": "Класс көп интерфейс іске асыра алады, бірақ тек бір класстан тудырады."}, {"q": "C# тілінде интерфейсті анық (explicit) іске асырған кезде код нені шығарады?", "c": "interface IRunner\n{\nvoid Run();\n}\nclass Athlete : IRunner\n{\nvoid IRunner.Run() => Console.Write(\"Running\");\n}\nIRunner r = new Athlete();\nr.Run();", "o": ["Компиляция қатесі", "Running", "Ештеңе шықпайды", "Athlete"], "a": 1, "e": "Explicit іске асыру тек IRunner түрі арқылы шақырылады."}, {"q": "C# тіліндегі қандай кілт сөз объект жасамай-ақ қолжетімді статикалық әдіс немесе класс жасауға мүмкіндік береді?", "c": "", "o": ["readonly", "static", "const", "sealed"], "a": 1, "e": "static мүше объект жасамай, Class.Method() түрінде шақырылады."}, {"q": "Статикалық қасиеті бар келесі код үзіндісі нені шығарады?", "c": "class Counter\n{\npublic static int Count = 0;\npublic Counter()\n{\nCount++;\n}\n}\nnew Counter();\nnew Counter();\nConsole.Write(Counter.Count);", "o": ["Компиляция қатесі", "0", "1", "2"], "a": 3, "e": "Count статикалық, екі объект жасалды — екі рет ++ орындалды."}, {"q": "C# тіліндегі мәндік тип (struct) пен сілтемелік тип (class) арасындағы басты айырмашылық неде?", "c": "", "o": ["Struct — мәндік, class — сілтемелік", "Struct — сілтемелік, class — мәндік", "Айырмашылық жоқ", "Struct-та әдіс болмайды"], "a": 0, "e": "Struct көшірме болып беріледі, class сілтеме болып беріледі."}, {"q": "Құрылымды әдіске бергенде келесі код үзіндісі нені шығарады?", "c": "struct Point\n{\npublic int X;\n}\nstatic void Change(Point p)\n{\np.X = 100;\n}\nPoint pt = new Point { X = 10 };\nChange(pt);\nConsole.Write(pt.X);", "o": ["10", "100", "0", "Компиляция қатесі"], "a": 0, "e": "Struct көшірмеленеді, сондықтан түпнұсқа өзгермейді."}, {"q": "КЛАССТЫ әдіске бергенде ұқсас код үзіндісі нені шығарады?", "c": "class PointClass\n{\npublic int X;\n}\nstatic void Change(PointClass p)\n{\np.X = 100;\n}\nPointClass pt = new PointClass { X = 10 };\nChange(pt);\nConsole.Write(pt.X);", "o": ["0", "10", "Компиляция қатесі", "100"], "a": 3, "e": "Class сілтеме болып беріледі, сондықтан түпнұсқа өзгереді."}, {"q": "C# 9.0+ нұсқасында жазба типтері (record) не үшін қолданылады?", "c": "", "o": ["Статикалық әдістер жазу үшін керек", "Өзгермейтін деректер моделі үшін", "Интерфейсті іске асыру үшін керек", "Файлмен жұмыс істеу үшін керек"], "a": 1, "e": "Record — мәні бойынша салыстырылатын, өзгермейтін деректер типі."}, {"q": "Екі жазбаны (record) салыстырған кезде C# кодының бұл үзіндісі нені шығарады?", "c": "public record Item(string Name, int Price);\nItem i1 = new Item(\"Pen\", 10);\nItem i2 = new Item(\"Pen\", 10);\nConsole.Write(i1 == i2);", "o": ["Item", "False", "Compile Error", "True"], "a": 3, "e": "Record-тар сілтемемен емес, мәндері бойынша салыстырылады."}, {"q": "Қандай кілт сөз параметрді әдіске сілтеме бойынша (by reference) оны өзгерту мүмкіндігімен беруге мүмкіндік береді?", "c": "", "o": ["ref", "in", "out", "params"],  "string нұсқасы шақырылады: «1» + «2» = «12»."}, {"q": "Бағдарламалық жасақтаманы жобалауда SOLID аббревиатурасы нені білдіреді?", "c": "", "o": ["Single, Open, Liskov, Interface, Dependency", "Simple, Object, Link, Inherit, Design", "Static, Open, Logic, Instance, Data", "Safe, Optimal, Light, Integrated, Dynamic"], "a": 0, "e": "SOLID: SRP, OCP, LSP, ISP, DIP — жобалаудың бес принципі."}, {"q": "Бірыңғай жауапкершілік принципі (Single Responsibility Principle — SRP) неде?", "c": "", "o": ["Класс өзгеруінің бір ғана себебі болуы", "Бағдарлама ішінде тек бір ғана класс болады", "Класс тек бір ғана объект жасай алады", "Класс ішінде тек бір ғана әдіс болады"], "a": 0, "e": "SRP: бір класс — бір жауапкершілік."}, {"q": "Егер класс SRP принципін бұзса (God Object / «Құдайлық объект» болып табылса), қандай мәселе туындайды?", "c": "", "o": ["Кодтың күрделенуі, түсіну қиындайды", "Жад аз жұмсалады, код қысқарады", "Бағдарлама жылдамырақ жұмыс істейді", "Ешқандай мәселе туындамайды"], "a": 0, "e": "Көп жұмыс істейтін класта бір өзгеріс басқа жерді бұзады."}, {"q": "Ашықтық/жабықтық принципі (Open/Closed Principle — OCP) неде?", "c": "", "o": ["Класс коды үнемі өзгертіліп отырады", "Барлық кластар sealed болуы керек", "Кеңейтуге ашық, өзгертуге жабық", "Әрқашан өзгертуге ашық болуы керек"], "a": 2, "e": "OCP: жаңа функцияны бар кодты өзгертпей қосасың."}, {"q": "Барбара Лисков алмастыру принципі (Liskov Substitution Principle — LSP) нені растайды?", "c": "", "o": ["Базалық класс абстрактілі болады", "Интерфейс класты алмастырмайды", "Туынды класс базалықты алмастыра алады", "Барлық кластар бір-бірін алмастырады"], "a": 2, "e": "LSP: туынды объект базалық орнына қойылса, бағдарлама бұзылмайды."}, {"q": "Интерфейстерді бөлу принципі (Interface Segregation Principle — ISP) неде?", "c": "", "o": ["Интерфейс мүлде қолданылмауы тиіс", "Әр класқа бір ғана интерфейс беріледі", "Үлкен интерфейс орнына шағын интерфейстер", "Барлық әдіс бір интерфейсте болуы керек"], "a": 2, "e": "I eException шығармай, null қайтарады."}, {"q": "?. операторы бар келесі код үзіндісі нені шығарады?", "c": "string text = null;\nConsole.Write(text?.Length ?? 0);", "o": ["NullReferenceException", "Компиляция қатесі", "0", "null"], "a": 2, "e": "text?.Length = null, ал ?? 0 оны 0-ге ауыстырады."}, {"q": "Бағдарламалық жасақтаманың модульділігі деп нені түсінеді?", "c": "", "o": ["Бағдарлама жылдамдығын арттыру тәсілі", "Бағдарламаны тәуелсіз бөліктерге бөлу", "Барлық кодты бір ғана файлға жазу", "Кодты шифрлап қорғау тәсілі"], "a": 1, "e": "Модуль — өз бетінше ауыстыруға болатын бөлік."}, {"q": "Inversion of Control (IoC / Басқаруды инверсиялау) деген не?", "c": "", "o": ["Кодты кері тәртіппен орындау", "Объект өзін өзі толық басқарады", "Деректі кері тәртіппен сақтау", "Объект жасауды сыртқы жүйеге беру"], "a": 3, "e": "IoC: тәуелділікті класс өзі емес, контейнер береді."}, {"q": "Тәуелділіктерді объектіге конструктор немесе қасиеттер арқылы беру жолымен IoC принципін қандай техника іске асырады?", "c": "", "o": ["Strategy pattern", "Dependency Injection", "Singleton pattern", "Factory Method"], "a": 1, "e": "DI — тәуелділікті конструктор немесе қасиет арқылы беру."}, {"q": "Тәуелділікті конструктор арқылы енгізетін келесі C# код үзіндісі нені шығарады?", "c": "interface ILogger\n{\nvoid Log(string msg);\n}\nclass ConsoleLogger : ILogger\n{\npublic void Log(string msg) => Console.Write(msg);\n}\nclass Service\n{\nprivate readonly ILogger _logger;\npublic Service(ILogger logger) => _logger = logger;\npublic void Run() => _logger.Log(\"Done\");\n}\nnew Service(new ConsoleLogger()).Run();", "o": ["ConsoleLogger", "Done", "Компиляция қатесі", "Service"], "a": 1, "e": "Service ConsoleLogger-ді алып, Log(«Done») шақырады."}, {"q": "Модульдік тесттер жазу кезінде интерфейстерді пайдаланудың артықшылығы неде?", "c": "", "o": ["Тәуелділіктерді алмастыруға болады", "Код орындалуы жылдамырақ болады", "Тест жазудың мүлде қажеті жоқ", "Жад аз жұмсалып, жылдам істейді"], "a": 0, ing — бастапқы өріс A → мақсатты өріс B."}, {"q": "System.IO.File класының қандай әдісі файлдағы барлық мәтінді бір операциямен жолға оқуға мүмкіндік береді?", "c": "", "o": ["File.Delete", "File.WriteAllText", "File.Copy", "File.ReadAllText"], "a": 3, "e": "ReadAllText — файлдың барлық мәтінін оқиды."}, {"q": "System.IO.File ішіндегі қандай әдіс жолдар массивін файлды жасай отырып немесе қайта жаза отырып, мәтіндік файлға жазу үшін қолданылады", "c": "", "o": ["File.ReadAllLines", "File.Move", "File.WriteAllLines", "File.Exists"], "a": 2, "e": "WriteAllLines — жолдар массивін файлға жазады."}, {"q": "CSV-жолды жеке өрістерге бөлетін C# код үзіндісі нені шығарады?", "c": "string csvRow = \"Alex,25,Developer\";\nstring[] fields = csvRow.Split(',');\nConsole.Write(fields[1]);", "o": ["Компиляция қатесі", "Alex", "25", "Developer"], "a": 2, "e": "Split үтір бойынша бөледі, индекс 1 — «25»."}, {"q": "Жолдар массивінің элементтерін string.Join әдісімен бір CSV-жолға біріктіру нені шығарады?", "c": "string[] data =\n{\n\"Ivan\", \"30\", \"Manager\"\n}\n;\nstring row = string.Join(\";\", data);\nConsole.Write(row);", "o": ["Компиляция қатесі", "Ivan;30;Manager", "Ivan,30,Manager", "Ivan 30 Manager"], "a": 1, "e": "Join элементтерді «;» арқылы біріктіреді."}, {"q": "Деректер базасына көшіру үшін күнді белгілі бір жолдық форматқа форматтау кезінде бұл код нені шығарады?", "c": "DateTime dt = new DateTime(2026, 11, 1);\nConsole.Write(dt.ToString(\"yyyy-MM-dd\"));", "o": ["2026-11-01", "01-11-2026", "2026/1/11", "Компиляция қатесі"], "a": 0, "e": "yyyy-MM-dd: жыл-ай-күн."}, {"q": "Форматы дұрыс емес күні бар жолды DateTime.Parse арқылы талдауға тырысқанда қандай ерекше жағдай орын алады?", "c": "string invalidDate = \"not-a-date\";\nDateTime dt = DateTime.Parse(invalidDate);", "o": ["IndexOutOfRangeException", "DivideByZeroException", "NullReferenceException", "FormatException"], "a": 3, "e": "Жол күн форматына сәйкес емес."}, {"q": "Күнді жолдан нақты форматты көрсете отырып қауіпсіз түрлендіру үшін қандай әдісті қолдану керек?", "c": "", "o": ["DateTime.AddDays әдісі", "DateTime.TryParseExact", "DateTime.ToString әдісі", "DateTime.Now қасиеті"], "a": 1, "e": "TryParseExact — нақты формат көрсетіледі, қате жоқ."}, {"q": "Көшіру кезіндегі деректердің тұтастығын бақылау (Data Integrity) деп нені түсінеді?", "c": "", "o": ["Деректі мүмкіндігінше жылдам көшіру", "Деректі шифрлап қорғап көшіру", "Көшіргенде деректің дәлдігін сақтау", "Деректі көшіргеннен кейін жою"], "a": 2, "e": "Data Integrity — деректер жоғалмайды, бұзылмайды."}, {"q": "Көшіру рәсімінде Деректерді валидациялау (Data Validation) кезеңі дегеніміз не?", "c": "", "o": ["Деректі көшіріп болған соң жою", "Деректі бастапқы жүйеге қайтару", "Жүктер алдында деректі тексеру", "Деректі архивке сығып сақтау"], "a": 2, "e": "Validation — формат, диапазон, міндеттілік тексеріледі."}, {"q": "Enum.TryParse көмегімен жолды санау (enum) мәніне түрлендіргенде бұл код нені шығарады?", "c": "enum Status\n{\n- Active, Inactive\n}\nEnum.TryParse(\"Active\", out Status st);\nConsole.Write(st == Status.Active);", "o": ["Active", "Компиляция қатесі", "False", "True"], "a": 3, "e": "«Active» enum-да бар, түрлендіру сәтті."}, {"q": "Үлкен мәндерде жылжымалы үтірлі double санын int типіне түрлендіру кезінде қандай мәселе туындауы мүмкін?", "c": "", "o": ["Сан автоматты түрде дөңгелектенеді", "Ештеңе болмайды, сан сақталады", "Мән шектен асуы (overflow) мүмкін", "Тек жұмыс жылдамдығы артады"], "a": 2, "e": "Үлкен double мәні int-ке сыймай қалады."}, {"q": "Деректердің үлкен көлемін көшіру рәсімдерінде пакеттік өңдеу (Batch Processing) не үшін қолданылады?", "c": "", "o": ["Деректі шифрлап қорғап қою үшін", "Деректі бөліктермен өңдеп, жадты үнемдеу", "Деректі толығымен жойып тастау үшін", "Кодты қысқарту, жеңілдету үшін"], "a": 1, "e": "Batch — миллион жазбаны бөліп жүктеу."}, {"q": "Convert.ToInt32(null) қолданатын келесі C# код үзіндісі нені шығарады?", "c": "int val = Convert.ToInt32(null);\nConsole.Write(val);", "o": ["null", "ArgumentNullException", "Компиляция қатесі", "0"], "a": 3, "e": "Convert.ToInt32(null) нәтижесі 0."}, {"q": "Convert.ToInt32(null) мен int.Parse(null) әрекетінің басты айырмашылығы неде?", "c": "", "o": ["Екеуі де ерекше жағдай жібереді", "Екеуі де нәтижесінде 0 қайтарады", "Екеуінің арасында айырмашылық жоқ", "Convert 0 қайтарады, Parse қате жібереді"], "a": 3, "e": "Convert — жұмсақ, Parse — қатаң."}, {"q": "Объектіні булев мәніне Convert.ToBoolean(1) арқылы түрлендіретін C# код үзіндісі нені шығарады?", "c": "bool flag = Convert.ToBoolean(1);\nConsole.Write(flag);", "o": ["False", "1", "Компиляция қатесі", "True"], "a": 3, "e": "0 — False, нөлден басқа кез келген сан — True."}, {"q": "Көшіру скрипттерінде конвертациялау хаттамалары (Migration Audit Logs) не үшін жасалады?", "c": "", "o": ["Көшіру журналы: аудит және қалпына келтіру", "Кодтың жылдамдығын арттыру үшін", "Жадты автоматты түрде тазалау үшін", "Деректі шифрлап қорғау үшін"], "a": 0, "e": "Audit log — не, қашан көшірілгенін жазып отырады."}, {"q": "is операторы (Pattern Matching) арқылы тексерумен анық келтіруге тырысқанда бұл код нені шығарады?", "c": "object input = 100;\nif (input is int number)\n{\nConsole.Write(number + 50);\n}", "o": ["150", "50", "Компиляция қатесі", "100"], "a": 0, "e": "number = 100, сондықтан 100 + 50 = 150."}, {"q": "Конвертациялауды орындау алдындағы келесі типтерді тексеру нені шығарады?", "c": "object val = \"123\";\nConsole.Write(val is string);", "o": ["True", "123", "Компиляция қатесі", "False"], "a": 0, "e": "val — string, мәні «123»."}, {"q": "Сәйкес келмейтін жүйелер арасында деректерді көшіру кезінде аралық схемалар (Staging Area / аралық сақтау ДБ) не үшін қолданылады?", "c": "", "o": ["Деректі шифрлап қорғап қою үшін", "Кодты қысқартып, жеңілдету үшін", "Деректі бірден толық жойып тастау", "Деректі тазалау үшін аралық сақтау орны"], "a": 3, "e": "Staging — жүктер алдындағы аралық аймақ."}, {"q": "Жаппай көшіру процесінде зақымдалған жазба анықталғанда қателерді өңдеудің қандай стратегиясы ұсынылады?", "c": "", "o": ["Бүкіл көшіруді тоқтатып, барлығын жою", "Қателерді мүлде елемей, өте беру", "Зақымдалған жазбаны өзгертпей жүктеу", "Қатені логтап, жазбаға тиісті әрекет жасау"], "a": 3, "e": "Қате жазба бөлек сақталады, процесс тоқтамайды."}, {"q": "System.Text.Encoding қолдана отырып, байттар массивін жолға және кері түрлендіргенде келесі C# код үзіндісі нені шығарады?", "c": "string original = \"Data\";\nbyte[] bytes = System.Text.Encoding.UTF8.GetBytes(original);\nstring restored = System.Text.Encoding.UTF8.GetString(bytes);\nConsole.Write(restored == original);", "o": ["Data", "False", "True", "Компиляция қатесі"], "a": 2, "e": "Байтқа айналып, қайта жолға қайтты — өзгермеді."}, {"q": "Деректерді көшіру рәсімін орындау кезінде транзакциялылықтың (Atomicity) қандай басты ережесі сақталуы тиіс?", "c": "", "o": ["Транзакция мүлде қолданылмайды", "Операция ішінара ғана орындалады", "Барлық қателер елеусіз қалдырылады", "Не бәрі орындалады, не бәрі кері қайтады"], "a": 3, "e": "Atomicity — «барлығы немесе ештеңе»."}];
const app=document.getElementById('app');
const L=['A','B','C','D'];
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const parts=[[0,50],[50,99],[99,148]];
let S=null;

function home(){
  S=null;
  app.innerHTML=`<h1>C# ООП тест</h1><p class="sub">Емтиханға дайындық · ${Q.length} сұрақ</p>
  <button class="card mode" onclick="start('all')"><span class="ic">📚</span><b>Барлық сұраққа жауап беру</b><span>Барлық ${Q.length} сұрақ бір тестте</span></button>
  <button class="card mode" onclick="partsMenu()"><span class="ic">🧩</span><b>Бөліктер бойынша</b><span>3 бөлік: 50 + 49 + 49 сұрақ</span></button>
  <button class="card mode" onclick="start('rand')"><span class="ic">🎲</span><b>Кездейсоқ 50 сұрақ</b><span>Әр жолы жаңа сұрақтар жиынтығы</span></button>`;
}
function partsMenu(){
  app.innerHTML=`<div class="top"><button onclick="home()">← Артқа</button></div><h2>Бөлікті таңдаңыз</h2><p class="sub">Сұрақтар 3 бөлікке бөлінген</p>`+
  parts.map((p,i)=>`<button class="card mode" onclick="start('part',${i})"><span class="ic">${i+1}</span><b>${i+1}-бөлік</b><span>${p[0]+1}–${p[1]} сұрақтар (${p[1]-p[0]} сұрақ)</span></button>`).join('');
}
function start(m,i){
  let ids;
  if(m==='all')ids=Q.map((_,k)=>k);
  else if(m==='part')ids=Array.from({length:parts[i][1]-parts[i][0]},(_,k)=>parts[i][0]+k);
  else{ids=Q.map((_,k)=>k);for(let k=ids.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[ids[k],ids[j]]=[ids[j],ids[k]]}ids=ids.slice(0,50)}
  S={ids,ans:{},cur:0};quiz();scrollTo(0,0);
}
function quiz(){
  const n=S.ids.length,k=S.cur,q=Q[S.ids[k]],a=S.ans[k];
  const done=Object.keys(S.ans).length;
  app.innerHTML=`<div class="top"><button onclick="if(confirm('Тесттен шығасыз ба? Нәтиже сақталмайды.'))home()">✕ Шығу</button><span>${k+1} / ${n} · жауап: ${done}</span></div>
  <div class="bar"><i style="width:${done/n*100}%"></i></div>
  <div class="card"><div class="q">${k+1}. ${esc(q.q)}</div>${q.c?`<pre>${esc(q.c)}</pre>`:''}
  ${q.o.map((o,j)=>`<button class="opt ${a===j?'s':''}" onclick="pick(${j})"><span class="l">${L[j]}</span><span>${esc(o)}</span></button>`).join('')}</div>
  <div class="row"><button class="btn g" ${k?'':'disabled'} onclick="go(-1)">← Алдыңғы</button>${k<n-1?`<button class="btn" onclick="go(1)">Келесі →</button>`:`<button class="btn" onclick="finish()">Аяқтау ✓</button>`}</div>
  <div class="nav">${S.ids.map((_,i)=>`<button class="${S.ans[i]!==undefined?'d':''} ${i===k?'c':''}" onclick="S.cur=${i};quiz()">${i+1}</button>`).join('')}</div>
  ${k<n-1?`<div class="row" style="margin-top:14px"><button class="btn g" onclick="finish()">Тестті аяқтау</button></div>`:''}`;
}
function pick(j){S.ans[S.cur]=j;quiz()}
function go(d){S.cur+=d;quiz();scrollTo(0,0)}
function finish(){
  const n=S.ids.length,done=Object.keys(S.ans).length;
  if(done<n&&!confirm(`Сіз ${n-done} сұраққа жауап берген жоқсыз. Аяқтайсыз ба?`))return;
  let ok=0;const bad=[];
  S.ids.forEach((id,k)=>{if(S.ans[k]===Q[id].a)ok++;else bad.push(k)});
  const p=Math.round(ok/n*100),col=p>=70?'var(--ok)':p>=50?'var(--pr)':'var(--er)';
  const msg=p>=90?'Тамаша нәтиже! 🎉':p>=70?'Жақсы нәтиже! 👍':p>=50?'Орташа, тағы дайындалыңыз 📖':'Қайталау қажет 💪';
  app.innerHTML=`<div class="card c"><h2>Тест нәтижесі</h2><div class="ring" style="--p:${p};--c:${col}"><div>${p}%</div></div>
  <p style="font-size:18px;margin:6px 0"><b>${n} сұрақтың ${ok}-ына</b> дұрыс жауап бердіңіз</p>
  <p class="sub" style="margin:0 0 6px">Дұрыс: ${p}% · Қате: ${100-p}%</p><p style="margin:0">${msg}</p></div>
  <div class="row"><button class="btn" onclick="home()">Басты мәзір</button></div>
  ${bad.length?`<h2 style="margin-top:24px">Қателескен сұрақтар (${bad.length})</h2>`+bad.map(k=>{
    const q=Q[S.ids[k]],u=S.ans[k];
    return `<div class="card"><span class="tag e">${u===undefined?'Жауап берілмеген':'Қате'}</span><div class="q">${S.ids[k]+1}. ${esc(q.q)}</div>${q.c?`<pre>${esc(q.c)}</pre>`:''}
    ${q.o.map((o,j)=>`<div class="opt ${j===q.a?'ok':j===u?'er':''}"><span class="l">${L[j]}</span><span>${esc(o)}</span></div>`).join('')}
    <div class="ans o">✓ Дұрыс жауап: ${L[q.a]}</div><div class="ans" style="color:var(--mu)">💡 ${esc(q.e)}</div>${u!==undefined?`<div class="ans x">✗ Сіздің жауабыңыз: ${L[u]}</div>`:''}</div>`}).join(''):`<div class="card c"><b>Барлық жауап дұрыс! Қате жоқ 🏆</b></div>`}`;
  scrollTo(0,0);
}
home();
</script>
</body>
</html>
